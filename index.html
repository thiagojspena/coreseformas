<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🌈 Cores & Formas</title>
<meta name="theme-color" content="#ffbf3f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cores & Formas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#fff9e9,#eaf7ff);color:#263238;min-height:100vh;touch-action:manipulation}
.app{max-width:900px;margin:auto;padding:18px;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:clamp(32px,7vw,52px);margin:5px 0;color:#ff8a00}.subtitle{font-size:20px;margin:0;color:#637083}
.stats{display:flex;gap:8px}.pill{background:#fff;border:2px solid #e4e8ee;border-radius:20px;padding:9px 14px;font-size:20px;font-weight:bold}
.panel{background:#fff;border:3px solid #e8edf2;border-radius:30px;padding:22px;margin-top:18px}.stage{font-size:18px;font-weight:bold;color:#667085}
.question{font-size:clamp(27px,6vw,43px);font-weight:900;margin:17px 0;line-height:1.2}.highlight{color:#ff6b6b}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:760px;margin:auto}.choice{min-height:190px;border:5px solid #edf0f3;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 0 #dfe4e8}.choice:active{transform:translateY(4px);box-shadow:0 2px 0 #dfe4e8}.choice:focus{outline:5px solid #b9ccff}
.shape{width:120px;height:120px}.circle{border-radius:50%}.square{border-radius:16px}.triangle{width:0;height:0;border-left:65px solid transparent;border-right:65px solid transparent;border-bottom:115px solid currentColor}.star{background:currentColor;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 95%,50% 73%,21% 95%,32% 57%,2% 35%,39% 35%);width:125px;height:125px}
.feedback{min-height:54px;font-size:29px;font-weight:900;margin:18px 0}.good{color:#14945d}.soft{color:#d87900}
.stars{font-size:34px;letter-spacing:5px;margin:4px}.btn{border:0;border-radius:20px;padding:14px 22px;background:#ffbf3f;color:#503600;font-weight:900;font-size:20px;margin:5px;cursor:pointer}.btn.secondary{background:#eef2ff;color:#4057b8}
.hidden{display:none}.intro{padding:10px}.intro .big{font-size:85px}.intro h2{font-size:38px;color:#ff8a00}.intro p{font-size:22px;line-height:1.4}
.reward .big{font-size:95px}.reward h2{font-size:38px;color:#ff8a00}.reward p{font-size:23px}
@media(max-width:600px){.app{padding:12px}.panel{padding:15px}.choices{gap:10px}.choice{min-height:145px;border-width:4px}.shape{width:82px;height:82px}.triangle{border-left-width:45px;border-right-width:45px;border-bottom-width:82px}.star{width:88px;height:88px}.question{margin:12px 0}.subtitle{font-size:17px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>🌈 Cores & Formas</h1><p class="subtitle">Vamos aprender brincando!</p></div><div class="stats"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🏆 <span id="stars">0</span></div></div></header>

<section id="intro" class="panel intro">
<div class="big">🌈🔵⭐</div><h2>Vamos brincar!</h2>
<p>Toque na figura que eu pedir.<br>Eu vou falar e mostrar cada desafio.</p>
<button class="btn" id="start">COMEÇAR 🎉</button>
</section>

<section id="game" class="panel hidden">
<div class="stage" id="stage"></div>
<div class="question" id="question"></div>
<div class="choices" id="choices"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="stars" id="roundStars">☆ ☆ ☆</div>
<button class="btn secondary" id="repeat" type="button">🔊 Ouvir de novo</button>
</section>

<section id="reward" class="panel reward hidden">
<div class="big" id="rewardIcon">🎉</div><h2 id="rewardTitle">Muito bem!</h2><p id="rewardText"></p>
<button class="btn" id="again" type="button">Continuar ⭐</button>
</section>
</div>

<script>
(()=> {
const colors=[{n:"vermelho",v:"#ef4444",e:"🔴"},{n:"azul",v:"#3b82f6",e:"🔵"},{n:"amarelo",v:"#f5c542",e:"🟡"},{n:"verde",v:"#22a06b",e:"🟢"}];
const shapes=["círculo","quadrado","triângulo","estrela"];
const state={score:0,stars:0,stage:1,round:0,correct:0,total:0};
let current=null,locked=false,speechText="",roundStart=0;

const $=id=>document.getElementById(id), pick=a=>a[Math.floor(Math.random()*a.length)], shuffle=a=>[...a].sort(()=>Math.random()-.5);
function speak(t){speechText=t;if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";u.rate=.8;u.pitch=1.15;speechSynthesis.speak(u)}}
function update(){ $("score").textContent=state.score;$("stars").textContent=state.stars}
function shape(s,c){let d=document.createElement("div");d.className="shape";d.style.color=c;if(s==="círculo"){d.classList.add("circle");d.style.background=c}else if(s==="quadrado"){d.classList.add("square");d.style.background=c}else if(s==="triângulo")d.classList.add("triangle");else d.classList.add("star");return d}
function choice(label,node,correct){let b=document.createElement("button");b.type="button";b.className="choice";b.setAttribute("aria-label",label);b.append(node);b.onclick=()=>answer(correct);$("choices").append(b)}
function start(){ $("intro").classList.add("hidden");$("reward").classList.add("hidden");$("game").classList.remove("hidden");state.round=0;state.stage=1;newRound()}
function newRound(){
 locked=false;$("feedback").textContent="";$("feedback").className="feedback";$("choices").innerHTML="";$("roundStars").textContent="☆ ☆ ☆";state.round++;
 let mode=state.stage<=2?"color":state.stage<=4?"shape":state.stage<=6?"combo":"identify";
 if(mode==="color")colorRound();if(mode==="shape")shapeRound();if(mode==="combo")comboRound();if(mode==="identify")identifyRound();
 update()
}
function colorRound(){let a=pick(colors);current=a.n;$("stage").textContent="🎨 FASE "+state.stage+" • CORES";$("question").innerHTML=`Encontre o <span class="highlight">${a.n}!</span>`;speak("Encontre o "+a.n);let arr=shuffle([a,...shuffle(colors.filter(x=>x.n!==a.n)).slice(0,2)]);arr.forEach(c=>choice(c.n,shape(pick(shapes.filter(s=>s!=="triângulo")),c.v),c.n===a.n))}
function shapeRound(){let a=pick(shapes);current=a;$("stage").textContent="🔷 FASE "+state.stage+" • FORMAS";$("question").innerHTML=`Encontre o <span class="highlight">${a}!</span>`;speak("Encontre o "+a);let arr=shuffle([a,...shuffle(shapes.filter(x=>x!==a)).slice(0,2)]);arr.forEach(s=>choice(s,shape(s,pick(colors).v),s===a))}
function comboRound(){let c=pick(colors),s=pick(shapes);current=c.n+"|"+s;$("stage").textContent="🎯 FASE "+state.stage+" • COR + FORMA";$("question").innerHTML=`Encontre o <span class="highlight">${s} ${c.n}!</span>`;speak("Encontre o "+s+" "+c.n);let arr=[{c,s,ok:true}];while(arr.length<3){let cc=pick(colors),ss=pick(shapes);if(!arr.some(x=>x.c.n===cc.n&&x.s===ss))arr.push({c:cc,s:ss,ok:false})}shuffle(arr).forEach(x=>choice(x.s+" "+x.c.n,shape(x.s,x.c.v),x.ok))}
function identifyRound(){let c=pick(colors);current=c.n;$("stage").textContent="🗣️ FASE "+state.stage+" • NOME DA COR";$("question").innerHTML=`Que cor é esta?`;let big=document.createElement("div");big.className="shape circle";big.style.background=c.v;$("choices").append(big);$("question").append(document.createElement("br"));speak("Que cor é esta?");shuffle(colors.slice()).forEach(x=>{let d=document.createElement("div");d.textContent=x.n;d.style.fontSize="27px";d.style.fontWeight="900";choice(x.n,d,x.n===c.n)})}
function answer(ok){
 if(locked)return;state.total++;
 if(ok){locked=true;state.correct++;let bonus=5+state.stage;state.score+=bonus;state.stars++;$("feedback").textContent="🎉 Muito bem! "+(state.stage>=5?"Você encontrou a combinação!":"Acertou!");$("feedback").className="feedback good";$("roundStars").textContent="⭐ ⭐ ⭐";speak("Muito bem! Você acertou!");update();setTimeout(()=>{if(state.round%4===0)finishStage();else newRound()},950)}
 else{$("feedback").textContent="😊 Quase! Vamos tentar outra vez."; $("feedback").className="feedback soft";speak("Quase! Vamos tentar outra vez.")}
}
function finishStage(){if(state.stage<8)state.stage++;$("game").classList.add("hidden");$("reward").classList.remove("hidden");$("rewardIcon").textContent=state.stage===9?"🏆":"🌟";$("rewardTitle").textContent=state.stage===9?"Desafio concluído!":"Fase conquistada!";$("rewardText").textContent=state.stage===9?"Você terminou todas as fases!":"Você ganhou estrelas. A próxima fase ficou um pouquinho mais difícil.";update()}
$("start").onclick=start;$("again").onclick=()=>{ $("reward").classList.add("hidden");$("game").classList.remove("hidden");newRound()};$("repeat").onclick=()=>speak(speechText);
update();
})();
</script>
<script>
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
